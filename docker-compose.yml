services:
  postgres:
    image: postgres:16-alpine
    container_name: preparation-pilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pilot_user
      POSTGRES_PASSWORD: pilot_password
      POSTGRES_DB: preparation_pilot_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pilot_user -d preparation_pilot_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
